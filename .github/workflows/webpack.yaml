name: NodeJS with Webpack

on:
  push:
    branches: [ "0000854453-node-11.4.2" ]
  pull_request:
    branches: [ "0000854453-node-11.4.2" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [11.x 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm audit fix
        npm update npm
        npm install  
        npm run webpack
        
